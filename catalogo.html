<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catálogo · PlayNext</title>
    <link rel="stylesheet" href="css/main.css">
</head>
<body>
    <header>
        <a href="index.html">PlayNext</a>
        <nav>
            <ul>
                <li><a href="catalogo.html">Explorar Catálogo</a></li>
                <li><button type="button">Sobre el Proyecto</button></li>
            </ul>
        </nav>
    </header>
    <main>
        <h1>Catálogo de juegos</h1>

        <h2>FILTRO DE BUSQUEDA:</h2>
        <form id="filtro">
            <fieldset>
                <legend>Modo de juego:</legend>
                <ul>
                    <li>
                        <input type="checkbox" name="solo" id="jugar-solo">
                        <label for="jugar-solo">Jugar solo</label>
                    </li>
                    <li>
                        <input type="checkbox" name="amigos" id="jugar-amigos">
                        <label for="jugar-amigos">Jugar con amigos</label>
                    </li>
            </fieldset>

        </form>
    </main>

    <script type="module" src="js/main.js"></script>
</body>
